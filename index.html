<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛孩好宅指南：寵物環境優化推薦系統</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome 圖標 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- 導覽列 -->
    <header class="bg-gradient-to-r content-center from-teal-600 to-emerald-600 text-white shadow-md mb-8">
        <div class="max-w-6xl mx-auto px-4 py-5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-house-chimney-window text-2xl text-amber-300"></i>
                <h1 class="text-xl font-bold tracking-wide">毛孩好宅指南 <span class="text-xs font-light bg-teal-700 px-2 py-1 rounded-full">環境優化系統</span></h1>
            </div>
            <p class="text-sm opacity-90 hidden sm:block">打造最適合牠的「夢幻安全家」</p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- 左側：控制面板與核心指標 -->
        <div class="space-y-6">
            <!-- 選擇寵物 -->
            <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-100">
                <label class="block text-slate-700 font-bold mb-3">
                    <i class="fa-solid fa-paw text-teal-500 mr-2"></i>1. 選擇或輸入寵物品種
                </label>
                <select id="petSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 font-medium focus:outline-hidden focus:border-teal-500 focus:ring-2 focus:ring-teal-100 transition-all mb-4">
                    <option value="corgi">🐶 柯基犬 (短腿/關節防護型)</option>
                    <option value="golden">🐶 黃金獵犬 (大型/散熱耐磨型)</option>
                    <option value="siamese">🐱 暹羅貓 (高活動/垂直空間型)</option>
                    <option value="ragdoll">🐱 布偶貓 (低敏/低處安全型)</option>
                    <option value="budgie">🦜 虎皮鸚鵡 (防夾/空氣敏感型)</option>
                    <option value="hamster">🐹 倉鼠 (防逃脫/夜行降噪型)</option>
                    <option value="bearded_dragon">🦎 鬆獅蜥 (環境控溫/外逃防範型)</option>
                    <option value="custom">✏️ 自訂其他寵物...</option>
                </select>

                <!-- 自訂寵物輸入框 -->
                <div id="customPetInput" class="hidden space-y-3 bg-teal-50/50 p-4 rounded-xl border border-teal-100">
                    <input type="text" id="customName" placeholder="例如：邊境牧羊犬" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm">
                    <p class="text-xs text-slate-500"><i class="fa-solid fa-circle-info mr-1"></i>自訂品種將載入通用全能型居家防護配置。</p>
                </div>
            </div>

            <!-- 環境指標儀表板 -->
            <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-100 space-y-4">
                <h3 class="text-slate-700 font-bold border-b border-slate-100 pb-2">
                    <i class="fa-solid fa-sliders text-teal-500 mr-2"></i>2. 理想環境指標
                </h3>
                
                <!-- 溫度與濕度 -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-amber-50/60 border border-amber-100 p-3 rounded-xl text-center">
                        <span class="text-xs text-amber-800 font-medium block mb-1"><i class="fa-solid fa-temperature-half mr-1"></i>建議室溫</span>
                        <span id="targetTemp" class="text-lg font-bold text-amber-700">22 - 25°C</span>
                    </div>
                    <div class="bg-sky-50/60 border border-sky-100 p-3 rounded-xl text-center">
                        <span class="text-xs text-sky-800 font-medium block mb-1"><i class="fa-solid fa-droplet mr-1"></i>建議濕度</span>
                        <span id="targetHumidity" class="text-lg font-bold text-sky-700">50 - 60%</span>
                    </div>
                </div>

                <!-- 空間需求與核心配置 -->
                <div class="text-xs space-y-3 pt-2">
                    <div class="flex justify-between items-center">
                        <span class="text-slate-500">基本活動空間</span>
                        <span id="spaceReq" class="font-bold text-slate-700 bg-slate-100 px-2 py-0.5 rounded-sm">中小型室內</span>
                    </div>
                    <div class="p-3 bg-rose-50 rounded-xl border border-rose-100">
                        <span class="text-rose-700 font-bold block mb-1 text-xs"><i class="fa-solid fa-triangle-exclamation mr-1"></i>重點居家危害：</span>
                        <p id="hazardAlert" class="text-rose-600 font-medium leading-relaxed">請留意落地窗未防護、易滑地板導致關節受損。</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：互動展示區 (包含虛擬客房與安全檢測) -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- 虛擬客房互動區 -->
            <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-slate-700 font-bold">
                        <i class="fa-solid fa-map-location-dot text-teal-500 mr-2"></i>3. 居家空間「配置熱點」推薦
                    </h3>
                    <span class="text-xs bg-teal-50 text-teal-700 px-3 py-1 rounded-full font-medium animate-pulse">點擊下方區域切換建議</span>
                </div>

                <!-- 模擬客房控制鈕（點擊切換不同角落） -->
                <div class="grid grid-cols-4 gap-2 mb-4 text-center">
                    <button onclick="switchZone('floor')" id="btn-floor" class="zone-btn py-2 px-1 text-xs sm:text-sm font-medium rounded-xl border bg-teal-600 text-white border-teal-600 transition-all shadow-xs cursor-pointer">
                        <i class="fa-solid fa-layer-group block mb-1 text-sm"></i>地板鋪設
                    </button>
                    <button onclick="switchZone('window')" id="btn-window" class="zone-btn py-2 px-1 text-xs sm:text-sm font-medium rounded-xl border bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100 transition-all cursor-pointer">
                        <i class="fa-solid fa-border-all block mb-1 text-sm"></i>窗戶陽台
                    </button>
                    <button onclick="switchZone('furniture')" id="btn-furniture" class="zone-btn py-2 px-1 text-xs sm:text-sm font-medium rounded-xl border bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100 transition-all cursor-pointer">
                        <i class="fa-solid fa-couch block mb-1 text-sm"></i>家具高度
                    </button>
                    <button onclick="switchZone('resting')" id="btn-resting" class="zone-btn py-2 px-1 text-xs sm:text-sm font-medium rounded-xl border bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100 transition-all cursor-pointer">
                        <i class="fa-solid fa-bowl-food block mb-1 text-sm"></i>飲食休息
                    </button>
                </div>

                <!-- 顯示具體建議框 -->
                <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 min-h-[140px] flex flex-col justify-center">
                    <div class="flex items-center space-x-2 text-teal-700 font-bold mb-2">
                        <span id="zoneTitleIcon"><i class="fa-solid fa-layer-group"></i></span>
                        <span id="zoneTitle">地板鋪設建議</span>
                    </div>
                    <p id="zoneContent" class="text-sm text-slate-600 leading-relaxed font-medium">
                        載入中...
                    </p>
                </div>
            </div>

            <!-- 安全指數自我檢測表 -->
            <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-100">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center border-b border-slate-100 pb-3 mb-4 gap-2">
                    <h3 class="text-slate-700 font-bold">
                        <i class="fa-solid fa-square-check text-teal-500 mr-2"></i>4. 居家安全指數自我檢測
                    </h3>
                    <div class="flex items-center space-x-2 bg-slate-50 px-3 py-1 rounded-full border border-slate-100">
                        <span class="text-xs text-slate-500 font-medium">目前安全度：</span>
                        <span id="safetyScore" class="text-sm font-black text-rose-500">0%</span>
                    </div>
                </div>

                <!-- 動態生成的核取清單 -->
                <div id="checklistContainer" class="space-y-3 mb-6">
                    <!-- JS 動態插入 -->
                </div>

                <!-- 生成與列印報告 -->
                <div class="text-right">
                    <button onclick="printReport()" class="bg-linear-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-bold text-sm px-6 py-3 rounded-xl shadow-md hover:shadow-lg transition-all cursor-pointer">
                        <i class="fa-solid fa-print mr-2"></i>生成並列印我的優化報告
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- 寵物環境核心資料庫 -->
    <script>
        const petDatabase = {
            corgi: {
                name: "柯基犬",
                temp: "22 - 25°C",
                humidity: "50 - 60%",
                space: "室內為主，每日需足夠散步",
                hazard: "沙發/床鋪過高、地面濕滑導致關節退化或椎間盤突出。",
                zones: {
                    floor: "強烈建議全面鋪設防滑地墊（如SPC石塑耐磨地板或防滑爬行墊）。避免拋光石英磚，以防止短腿犬奔跑時後肢外翻受傷。",
                    window: "窗台防護高度至少 60cm。柯基好奇心強，陽台欄杆間隙若大於 12cm，請加裝防護網以免發生意外卡住。",
                    furniture: "沙發與床旁務必放置『斜坡階梯』（勿用垂直階梯）。禁止牠直接從超過 40cm 的高處跳下，保護脊椎。",
                    resting: "飯碗與水碗建議置於 10-15cm 的微高架上，減少低頭進食對頸椎與前肢的負擔。"
                },
                checklist: [
                    "客廳與走道已鋪設防滑地墊或防滑膠條。",
                    "沙發或床邊已加裝專用寵物斜坡，無直接跳躍高處風險。",
                    "易碎物品與尖銳桌角已妥善包覆或移至 60cm 以上高處。",
                    "環境中無擺放發財樹、黃金葛等對犬隻有毒的植物。",
                    "浴室門平時保持關閉，防止誤食清潔劑或滑倒。"
                ]
            },
            golden: {
                name: "黃金獵犬",
                temp: "20 - 24°C (極度怕熱)",
                humidity: "45 - 55%",
                space: "需要寬敞客廳，每日需要大量戶外運動",
                hazard: "長期高溫高濕易引發急性濕疹、缺乏足夠趴臥散熱空間與關節磨損。",
                zones: {
                    floor: "需要高耐磨的地板（防止指甲抓傷），同時需具備基本阻力防止大型犬起步時滑倒。建議玄關處設置落塵區清潔腳爪。",
                    window: "陽台門窗需有穩固鎖扣。大型犬力道大，需防範其興奮時撲撞紗窗，建議加裝鋁格柵防護網。",
                    furniture: "大型犬需要專屬的大型乳膠睡墊（厚度大於 8cm），直接睡硬地板易導致肘關節長繭或滑囊炎。家具間通道應保持 80cm 以上順暢。",
                    resting: "進食碗必須使用大型落地重型不鏽鋼碗，或搭配 25-30cm 的高架餐台，能大幅降低因進食過快吞入空氣導致的胃扭轉風險。"
                },
                checklist: [
                    "已為牠準備專屬的加厚導熱散熱墊或獨立睡墊。",
                    "家裡常備除濕機與冷氣，確保夏天室溫不超過 26°C。",
                    "廚房垃圾桶已加蓋或鎖上，防止大型犬翻找誤食骨頭或塑膠袋。",
                    "客廳動線寬敞，無擺放易被大尾巴掃落的矮櫃擺飾。",
                    "餐具已改用重型防滑碗或高架碗，避免進食姿勢不良。"
                ]
            },
            siamese: {
                name: "暹羅貓",
                temp: "23 - 27°C (喜好溫暖)",
                humidity: "45 - 55%",
                space: "極度需要垂直立體空間，平面面積非唯一指標",
                hazard: "高空墜樓風險、防蚊紗窗被貓爪抓破外逃、缺乏高處躲藏點導致焦慮。",
                zones: {
                    floor: "地板不限材質，但需要注意桌腳或椅腳可纏繞麻繩供其磨爪。地面若有散落的橡皮筋、線頭需立即收好防止誤食。",
                    window: "【重中之重】所有對外窗務必安裝『隱形防護網』或『金屬金剛網紗窗』。普通尼龍紗窗一抓即破，極易發生墜樓慘劇。",
                    furniture: "利用牆面打造貓跳台、頂天立地貓抓柱或空出櫃子頂部空間。暹羅貓喜歡俯瞰領域，垂直高度建議至少達 1.5 - 1.8 米以上。",
                    resting: "水資源採取多點擺放（至少兩處），並遠離砂盆。食盆建議與砂盆保持 2 公尺以上距離，並使用半封閉式砂盆減少揚塵與異味。"
                },
                checklist: [
                    "所有開窗處均已安裝防貓開、防抓破的金剛網或防護柵欄。",
                    "房間或客廳有至少一組高度超過 1.2 米的貓跳台或高處棲息點。",
                    "家中的百葉窗拉繩、電線均已妥善收納收短，防範繞頸窒息。",
                    "確認無百合花、黃金葛、蘆薈等致命貓咪有毒植物。",
                    "細小雜物（針線、感冒藥、鈕扣電池）皆收進有鎖抽屜。"
                ]
            },
            ragdoll: {
                name: "布偶貓",
                temp: "22 - 25°C",
                humidity: "50 - 60%",
                space: "室內生活，喜歡陪伴",
                hazard: "體型較大但跳躍力與平衡感較弱，易從高處摔傷；長毛易打結與沾染排泄物。",
                zones: {
                    floor: "地面應避免過度凌亂。布偶貓毛長且底盤低，地板需定時除塵吸毛。建議在主要活動區鋪設質地柔軟的短毛地毯。",
                    window: "同樣需要防護網，但更要防範陽台日照過曝。布偶貓較不善於高難度閃避，窗台邊緣不宜擺放易翻倒的盆栽。",
                    furniture: "牠們更喜歡待在沙發、低矮的貓窩或人類床上。如果買貓跳台，請選擇階梯間距較近、底座沉穩寬大（防翻倒）的款式。",
                    resting: "由於體型大、面部扁平，請提供大口徑、淺底的陶瓷食盆，並準備特大號的貓砂盆（長度至少為貓身 1.5 倍），防止轉身困難。"
                },
                checklist: [
                    "窗戶皆已做好基礎防護，防止貓咪因捕捉窗外昆蟲而墜落。",
                    "貓砂盆尺寸寬敞，且放置在安靜、通風良好的角落。",
                    "家中的多肉植物、龜背芋等盆栽已移至貓咪絕對接觸不到的地方。",
                    "沙發或床底下無危險縫隙或外露的外釘彈簧。",
                    "高處櫃檯邊緣已清空，無容易被觸落砸傷的重物。"
                ]
            },
            budgie: {
                name: "虎皮鸚鵡",
                temp: "20 - 28°C (對溫差敏感)",
                humidity: "45 - 65%",
                space: "安全鳥籠，每日定時室內放飛飛行",
                hazard: "誤撞透明玻璃、被門縫夾傷、誤食廚房油煙或特富龍（不沾鍋）有毒氣體。",
                zones: {
                    floor: "放飛時地面絕不能有積水（如未蓋的馬桶、水桶），鳥類落地時易溺水。避免地面有掉落的廚房碎屑、巧克力或鹽粒。",
                    window: "放飛前務必拉上『不透明窗簾』。鳥類無法識別透明玻璃，直接高速撞擊會導致頸椎斷裂死亡。對外窗絕對緊閉。",
                    furniture: "鳥籠應放置在背後有牆壁依靠的穩定處（提供安全感），高度與成人視線齊平。遠離冷氣出風口與廚房（廚房油煙對鳥肺致命）。",
                    resting: "鳥籠內需提供不同粗細的天然原木站棍以鍛鍊腳爪，避免長期使用塑膠棍導致趾瘤症。水質需每日更換。"
                },
                checklist: [
                    "每次放飛前，皆確認窗戶緊閉且已拉上防撞紗簾/布簾。",
                    "鳥籠放置在通風良好、無冷氣直吹且避開廚房油煙的地方。",
                    "室內無使用香精、香氛蠟燭、蚊香或噴霧型殺蟲劑。",
                    "放飛區域內的吊扇已完全關閉，且確認門縫無夾傷可能。",
                    "鳥籠內站棍皆為天然無毒木質，且備有乾淨的過濾飲用水。"
                ]
            },
            hamster: {
                name: "倉鼠",
                temp: "20 - 26°C (低於18°C易偽冬眠危及生命)",
                humidity: "40 - 55%",
                space: "符合法規的基本大空間籠舍 (黃金鼠大於 40x60cm)",
                hazard: "越獄後咬壞電線、高處跌落（無高度空間概念）、使用劣質墊材導致呼吸道過敏。",
                zones: {
                    floor: "飼育籠嚴禁直接貼地放置以防地氣過冷。若不慎脫逃，地面牆角不能有寬度大於 1.5cm 的縫隙，否則極難尋回。",
                    window: "飼育籠應完全避開陽光直射的窗台，西曬會導致籠內溫室效應，倉鼠極易熱衰竭死亡。",
                    furniture: "籠舍應置於穩固、貓狗無法觸及的獨立桌面或櫃子上。籠內擺設（如跑輪、小窩）高度不宜超過 20cm，防範跌落受傷。",
                    resting: "鋪設至少 4-10cm 厚度的無塵天然紙墊材供其挖掘。配置符合體型的靜音跑輪（黃金鼠建議 25cm 以上）以發洩精力。"
                },
                checklist: [
                    "飼育籠放置在陽光無法直射、環境安靜且無貓狗威脅的暗處。",
                    "籠網間隙小於 0.8cm（一線/三線鼠）或籠蓋有安全扣扣緊防逃。",
                    "墊材厚度足夠其挖掘，且非含有大量粉塵的劣質木屑。",
                    "備有高準確度的溫濕度計在籠旁，隨時監控保暖狀況。",
                    "跑輪尺寸正確且無縫隙（防止卡腳受傷）。"
                ]
            },
            bearded_dragon: {
                name: "鬆獅蜥",
                temp: "日間熱點 38-42°C / 冷區 28-30°C",
                humidity: "30 - 40% (喜乾燥)",
                space: "至少 3 呎以上的爬蟲專用通風箱",
                hazard: "環境溫度不足導致無法消化食物、誤食底材（如石沙）引過腸梗阻、外逃失溫。",
                zones: {
                    floor: "爬缸底材建議使用爬蟲專用鈣沙、廚房紙巾或防水地墊。嚴禁使用小碎石或路邊砂土，防止其捕食昆蟲時誤食窒息。",
                    window: "可定時在窗邊曬自然太陽（需注意無玻璃阻擋，因玻璃會阻隔 UVA/UVB），但缸體本身切勿放在無遮蔽的西曬窗台。",
                    furniture: "缸內必須設置高低落差的『曬背石』或耐高溫沉木，讓牠能自行攀爬調整與上方加熱燈的距離。加裝安全網罩防止燙傷。",
                    resting: "需劃分明確的『加熱曬背區』與『陰涼躲藏區』。水盆需極淺且寬，防止翻倒且能方便其泡澡促進排便。"
                },
                checklist: [
                    "爬缸內已安裝專用 UVB 紫外線燈與 UVA 加熱爆曬燈。",
                    "缸內有冷熱兩端溫標，且熱點溫度有達到 38°C 以上。",
                    "底材安全安全無誤食風險（新手推薦廚房紙巾或專用墊）",
                    "燈具皆有加裝防燙網罩，防止爬蟲直接碰觸燙傷。",
                    "飼育箱拉門有加裝安全鎖，防範鬆獅蜥推開門外逃。"
                ]
            },
            custom: {
                name: "自訂品種",
                temp: "22 - 26°C",
                humidity: "50 - 60%",
                space: "視寵物體型調整",
                hazard: "未知的居家縫隙、誤食人類食物及暴露在危險高空。",
                zones: {
                    floor: "建議維持地面整潔，定期吸塵。如果是哺乳類寵物，基本上都應防範拋光磚過滑的問題。",
                    window: "不論何種寵物，對外陽台與窗戶皆應安裝防護網或安全鎖，出門前務必確認關閉。",
                    furniture: "居家家具應固定牢靠，避免地震時傾倒。電線應使用集線管包覆，防止各式寵物好奇啃咬。",
                    resting: "飲食區與排泄區應明確分隔。提供乾淨、煮沸過的常溫水，並將人類食物與藥品收納於高處防開櫃中。"
                },
                checklist: [
                    "家中電線已使用防咬保護管進行包覆。",
                    "陽台及窗戶設有防護機制，防止寵物意外墜落或逃逸。",
                    "所有的藥品、清潔劑及危險化學品均已鎖在櫃子內。",
                    "垃圾桶具有蓋子或踏板功能，寵物無法輕易翻開。",
                    "室內通風良好，且維持在相對舒適穩定的溫濕度。"
                ]
            }
        };

        let currentZone = 'floor';

        // 初始化與切換寵物資料
        function updatePetEnvironment() {
            const select = document.getElementById('petSelect');
            let selectedValue = select.value;
            
            // 處理自訂品種
            const customInputDiv = document.getElementById('customPetInput');
            if (selectedValue === 'custom') {
                customInputDiv.classList.remove('hidden');
                const customName = document.getElementById('customName').value.trim();
                petDatabase.custom.name = customName ? customName : "自訂毛孩";
            } else {
                customInputDiv.classList.add('hidden');
            }

            const data = petDatabase[selectedValue];

            // 更新儀表板指標
            document.getElementById('targetTemp').innerText = data.temp;
            document.getElementById('targetHumidity').innerText = data.humidity;
            document.getElementById('spaceReq').innerText = data.space;
            document.getElementById('hazardAlert').innerText = data.hazard;

            // 更新動態熱點文字
            switchZone(currentZone);

            // 更新安全檢查清單
            const checklistContainer = document.getElementById('checklistContainer');
            checklistContainer.innerHTML = '';
            
            data.checklist.forEach((item, index) => {
                const itemHtml = `
                    <label class="flex items-start p-3 bg-slate-50 hover:bg-teal-50/40 rounded-xl border border-slate-200/70 cursor-pointer transition-all">
                        <input type="checkbox" class="safety-checkbox mt-1 text-teal-600 focus:ring-teal-500 border-slate-300 rounded-sm w-4 h-4 mr-3 cursor-pointer" onchange="calculateSafetyScore()">
                        <span class="text-sm text-slate-600 font-medium leading-relaxed">${item}</span>
                    </label>
                `;
                checklistContainer.insertAdjacentHTML('beforeend', itemHtml);
            });

            // 重設分數
            calculateSafetyScore();
        }

        // 切換空間熱點建議
        function switchZone(zone) {
            currentZone = zone;
            const select = document.getElementById('petSelect');
            const data = petDatabase[select.value];
            
            // 移除所有按鈕的啟用樣式
            document.querySelectorAll('.zone-btn').forEach(btn => {
                btn.classList.remove('bg-teal-600', 'text-white', 'border-teal-600');
                btn.classList.add('bg-slate-50', 'text-slate-600', 'border-slate-200', 'hover:bg-slate-100');
            });

            // 啟用當前點擊的按鈕
            const activeBtn = document.getElementById(`btn-${zone}`);
            activeBtn.classList.remove('bg-slate-50', 'text-slate-600', 'border-slate-200', 'hover:bg-slate-100');
            activeBtn.classList.add('bg-teal-600', 'text-white', 'border-teal-600');

            // 更改內容與圖標
            const zoneTitles = {
                floor: { title: "地板鋪設優化建議", icon: '<i class="fa-solid fa-layer-group"></i>' },
                window: { title: "窗戶與陽台防護建議", icon: '<i class="fa-solid fa-border-all"></i>' },
                furniture: { title: "家具配置高度建議", icon: '<i class="fa-solid fa-couch"></i>' },
                resting: { title: "飲食與作息專區規劃", icon: '<i class="fa-solid fa-bowl-food"></i>' }
            };

            document.getElementById('zoneTitleIcon').innerHTML = zoneTitles[zone].icon;
            document.getElementById('zoneTitle').innerText = zoneTitles[zone].title;
            document.getElementById('zoneContent').innerText = data.zones[zone];
        }

        // 計算安全分數
        function calculateSafetyScore() {
            const checkboxes = document.querySelectorAll('.safety-checkbox');
            const total = checkboxes.length;
            if (total === 0) return;

            let checkedCount = 0;
            checkboxes.forEach(cb => { if (cb.checked) checkedCount++; });

            const score = Math.round((checkedCount / total) * 100);
            const scoreEl = document.getElementById('safetyScore');
            
            scoreEl.innerText = `${score}%`;

            // 根據分數變更顏色
            scoreEl.className = "text-sm font-black p-1 px-2 rounded-sm";
            if (score < 40) {
                scoreEl.classList.add('bg-rose-100', 'text-rose-600');
            } else if (score < 80) {
                scoreEl.classList.add('bg-amber-100', 'text-amber-600');
            } else {
                scoreEl.classList.add('bg-emerald-100', 'text-emerald-600');
            }
        }

        // 監聽事件
        document.getElementById('petSelect').addEventListener('change', updatePetEnvironment);
        document.getElementById('customName').addEventListener('input', () => {
            if (document.getElementById('petSelect').value === 'custom') {
                const name = document.getElementById('customName').value.trim();
                petDatabase.custom.name = name ? name : "自訂毛孩";
            }
        });

        // 友善列印功能
        function printReport() {
            const select = document.getElementById('petSelect');
            const data = petDatabase[select.value];
            const score = document.getElementById('safetyScore').innerText;

            let undoneItems = "";
            const checkboxes = document.querySelectorAll('.safety-checkbox');
            checkboxes.forEach((cb) => {
                if (!cb.checked) {
                    undoneItems += `<li style="margin-bottom: 8px; color: #b91c1c;">⚠️ 待改善：${cb.nextElementSibling.innerText}</li>`;
                }
            });

            if (undoneItems === "") {
                undoneItems = "<li style='color: #047857;'>🎉 太棒了！您已完成所有基本安全佈置項目！</li>";
            }

            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>環境優化建議書 - ${data.name}</title>
                    <style>
                        body { font-family: sans-serif; padding: 40px; color: #334155; line-height: 1.6; }
                        .header { border-bottom: 3px solid #0d9488; padding-bottom: 10px; margin-bottom: 3px; }
                        h1 { color: #0d9488; margin-bottom: 5px; }
                        h2 { color: #0f172a; border-left: 4px solid #0d9488; padding-left: 10px; margin-top: 30px; }
                        .grid { display: flex; gap: 20px; margin-top: 20px; }
                        .card { flex: 1; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
                        .score { font-size: 24px; font-weight: bold; color: #0d9488; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>🏠 毛孩好宅居家環境規劃書</h1>
                        <p>專屬對象品種：<strong>${data.name}</strong> | 當前安全評估指數：<span class="score">${score}</span></p>
                    </div>
                    
                    <h2>📊 核心環境指標</h2>
                    <div class="grid">
                        <div class="card"><strong>🌡️ 理想室溫：</strong><br>${data.temp}</div>
                        <div class="card"><strong>💧 理想濕度：</strong><br>${data.humidity}</div>
                        <div class="card"><strong>🛹 空間需求：</strong><br>${data.space}</div>
                    </div>

                    <h2>🗺️ 四大空間改造具體方針</h2>
                    <ul>
                        <li><strong>🧱 地板鋪設：</strong> ${data.zones.floor}</li>
                        <li><strong>🪟 窗戶陽台：</strong> ${data.zones.window}</li>
                        <li><strong>🛋️ 家具高度：</strong> ${data.zones.furniture}</li>
                        <li><strong>🥣 飲食休息：</strong> ${data.zones.resting}</li>
                    </ul>

                    <h2>🚨 居家安全指數追蹤與改善清單</h2>
                    <ul style="list-style: none; padding-left: 0;">
                        ${undoneItems}
                    </ul>

                    <p style="margin-top: 50px; font-size: 12px; color: #94a3b8; text-align: center;">報告生成時間：2026年 | 毛孩好宅指南系統</p>
                    <script>window.print();<\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }

        // 網頁首次載入初始化
        window.onload = function() {
            updatePetEnvironment();
        };
    </script>
</body>
</html>
